[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baton-shim"
version = "0.1.0"
description = "MCP shim that lets AI agents use a Baton coordination server"
requires-python = ">=3.10"
# Pinned below 2.0: mcp 2.x renamed FastMCP to MCPServer. Migrate deliberately when needed.
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
baton-shim = "baton_shim.server:main"

[tool.setuptools]
packages = ["baton_shim"]
